50" y2="1131" stroke="#5a7191" stroke-width="2.2" marker-end="url(#arr)"/><rect x="290" y="1132" width="520" height="62" rx="12" fill="#eef4ff" stroke="#6e9da5" stroke-width="2"/><text x="550" y="1169" text-anchor="middle" font-family="Arial" font-size="17" fill="#243e59">Generate PDF or Excel</text><line x1="550" y1="1194" x2="550" y2="1232" stroke="#5a7191" stroke-width="2.2" marker-end="url(#arr)"/><rect x="290" y="1233" width="520" height="62" rx="12" fill="#e9f5f2" stroke="#6e9da5" stroke-width="2"/><text x="550" y="1270" text-anchor="middle" font-family="Arial" font-size="17" fill="#243e59">Archive report and provide download link</text><path d="M290 449 H156 V310 H290" fill="none" stroke="#c6845e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="130" y="378" text-anchor="middle" font-family="Arial" font-size="14" fill="#9b6244">Input invalid</text><path d="M810 550 H936 V711 H810" fill="none" stroke="#c6845e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="935" y="640" text-anchor="middle" font-family="Arial" font-size="13" fill="#9b6244">Unavailable:</text><text x="935" y="656" text-anchor="middle" font-family="Arial" font-size="13" fill="#9b6244">show error</text><text x="550" y="1430" text-anchor="middle" font-family="Arial" font-size="13" fill="#566b84">Simplified from the report, including parallel data retrieval, errors and optional output formats.</text></svg>