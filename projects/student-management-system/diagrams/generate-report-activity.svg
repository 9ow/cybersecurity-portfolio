<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1500" viewBox="0 0 1100 1500"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5a7191"/></marker></defs><rect width="1100" height="1500" fill="#f8fafc"/><text x="550" y="49" text-anchor="middle" font-family="Arial" font-size="28" fill="#1f3555" font-weight="bold">Activity Diagram — Generate Report</text><text x="550" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#526a84">Privacy-safe redraw based on the submitted process model</text><rect x="80" y="100" width="940" height="1310" rx="16" fill="white" stroke="#acb9ca"/><rect x="290" y="122" width="520" height="62" rx="12" fill="#e9f5f2" stroke="#6e9da5" stroke-width="2"/><text x="550" y="159" text-anchor="middle" font-family="Arial" font-size="17" fill="#243e59">Auditor selects Generate Report</text><line x1="550" y1="184" x2="550" y2="222" stroke="#5a7191" stroke-width="2.2" marker-end="url(#arr)"/><rect x="290" y="223" width="520" height="62" rx="12" fill="#e9f5f2" stroke="#6e9da5" stroke-width="2"/><text x="550" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#243e59">Report UI displays filter options</text><line x1="550" y1="285" x2="550" y2="323" stroke="#5a7191" stroke-width="2.2" marker-end="url(#arr)"/><rect x="290" y="324" width="520" height="62" rx="12" fill="#e9f5f2" stroke="#6e9da5" stroke-width="2"/><text x="550" y="361" text-anchor="middle" font-family="Arial" font-size="17" fill="#243e59">Auditor enters filters and submits</text><line x1="550" y1="386" x2="550" y2="424" stroke="#5a7191" stroke-width="2.2" marker-end="url(#arr)"/><rect x="290" y="425" width="520" height="62" rx="12" fill="#eef4ff" stroke="#6e9da5" stroke-width="2"/><text x="550" y="462" text-anchor="middle" font-family="Arial" font-size="17" fill="#243e59">Report Service validates input</text><line x1="550" y1="487" x2="550" y2="525" stroke="#5a7191" stroke-widt